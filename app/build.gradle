plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.azalogistics.pda'
    compileSdk 36

    defaultConfig {
        applicationId "com.azalogistics.pda"
        minSdk 28
        targetSdk 36
        versionCode 17
        versionName "1.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Firma de debug: válida solo para instalar/probar en desarrollo (adb, Scan2Deploy
            // de pruebas). Para la versión final de producción hay que sustituirla por una
            // keystore de release propia.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'com.datalogic:datalogic-android-sdk:1.50'
    // Generación (no lectura) de códigos de barras para mostrar el ID del dispositivo
    // en pantalla — el SDK de Datalogic de arriba es para el escáner físico, no genera.
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- Walkie (PTT por LAN) ---
    def composeBom = platform('androidx.compose:compose-bom:2024.09.02')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}