# snippets/devops/service.yaml
# Service + Ingress + NetworkPolicy — ver recipes/deploy-kubernetes-application.md.

apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
spec:
  selector: { app: pedidos-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
spec:
  rules:
    - http:
        paths:
          - path: /api/pedidos
            pathType: Prefix
            backend:
              service: { name: pedidos-service, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pedidos-service-policy
spec:
  podSelector: { matchLabels: { app: pedidos-service } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api-gateway } } }]
      ports: [{ port: 8080, protocol: TCP }]
