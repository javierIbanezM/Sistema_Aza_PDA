# snippets/devops/docker-compose.yml
# Entorno local con healthchecks y secretos externalizados — ver knowledge/docker/docker.md.

services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      - DB_HOST=db
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets: [db_password]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 10s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

secrets:
  db_password:
    file: ./secrets/db_password.txt  # nunca commiteado, ver .gitignore

volumes:
  db-data:
